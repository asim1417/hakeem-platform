name: Eval Search (read-only)

# مقياس جودة الاسترجاع على مجموعة استعلامات ذهبية (P@k / MRR / systemHit / nDCG).
# قراءة فقط — لا كتابة، لا seed، لا backfill. يحوّل ضبط الترتيب من حدس إلى قياس.
#
# يفضّل سرّ NEON_DATABASE_URL (قراءة) لقياس الإنتاج الحقيقي؛ وإلا يعود إلى DATABASE_URL.
# اضبط gate=true لجعل المهمّة تفشل إن نزل systemHit@3 عن العتبة (افتراضي 0.6).
# suite=everyday (HKM-062): أسئلة الناس عبر searchArticles (مسار hakeem_search) من data/eval/everyday-queries.json.
# suite=precise (HKM-062): الأسئلة النظامية الدقيقة وعيّنة known-item عبر searchArticles، مقابل أعلى ثلاث للإنتاج.

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "تشغيل كبوّابة (يفشل دون العتبة)"
        type: boolean
        default: false
      min_systemhit3:
        description: "عتبة systemHit@3 عند التشغيل كبوّابة (0..1)"
        type: string
        default: "0.6"
      provider:
        description: "المزوّد المُقاس: core (searchLegalCore) أو hybrid (RRF)"
        type: choice
        options: ["core", "hybrid"]
        default: "core"
      in_db_recall:
        description: "الاستدعاء المفهرس داخل القاعدة (tsvector): 1 مُفعَّل، 0 معطَّل (مسار ILIKE)"
        type: choice
        options: ["1", "0"]
        default: "1"
      core_opensearch:
        description: "إشارة OpenSearch داخل النواة: 1 مُفعَّلة (بعد)، 0 معطَّلة (خطّ الأساس قبل)"
        type: choice
        options: ["1", "0"]
        default: "1"
      suite:
        description: "المجموعة: search (eval-search على النواة/الهجين) أو everyday (HKM-062: أسئلة الناس عبر searchArticles التي يستعملها hakeem_search)"
        type: choice
        options: ["search", "everyday", "precise"]
        default: "search"
      everyday_variants:
        description: "everyday/precise فقط (اختياري): JSON لتشغيل أكثر من إعداد في تشغيل واحد، مثل [{\"name\":\"default\"}]"
        type: string
        default: ""
      precise_dump:
        description: "precise فقط: 1 يطبع أعلى ثلاث بالمعرّف لكل سؤال (لبناء baseline من main)"
        type: choice
        options: ["0", "1"]
        default: "0"
      concurrency:
        description: "everyday/precise فقط: عدد الأسئلة المتزامنة (1..4)"
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FALLBACK_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # تفعيل الدلالي في القياس (اختياري — يسقط آمناً للمعجمي إن غاب المفتاح).
      SEMANTIC_SEARCH: "true"
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # إشارة OpenSearch الخامسة داخل النواة — لقياس أثرها الحقيقي (تسقط آمناً إن غاب العنقود).
      OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      CORE_OPENSEARCH: ${{ inputs.core_opensearch }}
      EVAL_MIN_SYSTEMHIT3: ${{ inputs.min_systemhit3 }}
      EVAL_PROVIDER: ${{ inputs.provider }}
      IN_DB_RECALL: ${{ inputs.in_db_recall }}
      EVAL_EVERYDAY_VARIANTS: ${{ inputs.everyday_variants }}
      EVAL_EVERYDAY_CONCURRENCY: ${{ inputs.concurrency }}
      EVAL_PRECISE_DUMP: ${{ inputs.precise_dump }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}" npm run db:generate
      - name: Run retrieval eval (read-only)
        run: |
          export DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          if [ -z "$DATABASE_URL" ]; then echo "::error::لا اتصال (اضبط NEON_DATABASE_URL أو DATABASE_URL)."; exit 1; fi
          SCRIPT="eval:search"
          if [ "${{ inputs.suite }}" = "everyday" ]; then SCRIPT="eval:everyday"; fi
          if [ "${{ inputs.suite }}" = "precise" ]; then SCRIPT="eval:precise"; fi
          if [ -z "$EVAL_EVERYDAY_VARIANTS" ]; then unset EVAL_EVERYDAY_VARIANTS; fi
          set -o pipefail
          if [ "${{ inputs.gate }}" = "true" ]; then
            npm run "$SCRIPT" -- --gate 2>&1 | tee "$RUNNER_TEMP/eval.log"
          else
            npm run "$SCRIPT" 2>&1 | tee "$RUNNER_TEMP/eval.log"
          fi
      # HKM-062: آخر السجل (الملخص) تعليقاتٍ تُقرأ من واجهة check-runs حين يتعذّر تنزيل السجل. قراءة فقط.
      - name: Publish summary as annotations
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/eval.log" ] || exit 0
          grep -v '^::' "$RUNNER_TEMP/eval.log" | tail -n 45 | python3 -c 'import sys
          t=sys.stdin.read().replace("%","%25").split("\n")
          cur=""; out=[]
          for l in t:
              if len(cur)+len(l)>3000 and cur: out.append(cur); cur=""
              cur+=("%0A" if cur else "")+l
          out.append(cur)
          [print("::notice title=eval tail %d::%s" % (i+1, c)) for i, c in enumerate(out[:8])]'
