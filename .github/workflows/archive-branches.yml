name: Archive branches (وسم archive/* ثم حذف الفرع)

# HKM-035: أرشفة الفروع المتجاوَزة بقرار المالك 23/10/2026 «نفذ كلها».
# لكل فرع في القائمة: وسم archive/<branch> على رأسه (استرجاع كامل بأمر git واحد)، ثم حذف الفرع.
# لا يُلمس main ولا أي فرع خارج القائمة. يدوي فقط.

on:
  workflow_dispatch:
    inputs:
      list:
        description: "ملف قائمة الفروع (سطر لكل فرع)"
        type: string
        required: true
        default: data/repo/branches-archive-2026-10-23.txt
      dry_run:
        description: "true = عرض فقط بلا وسم ولا حذف"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: archive-branches
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: أرشفة
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ inputs.list }}
          DRY: ${{ inputs.dry_run }}
          NOTE: |
            أُرشف هذا الفرع بقرار المالك (23/10/2026): الوسم archive/<branch> يحفظ رأسه كاملًا (git checkout archive/<branch>)؛ محتواه إما مدمج في main أو تجاوزه، وما يستحق الاستعادة سُجّل مهمةً في docs/PROJECT_STATUS.md (HKM-035). يُغلق الطلب بحذف الفرع.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
        run: |
          set -euo pipefail
          test -f "$LIST"
          git config user.name "hakeem-archive-bot"
          git config user.email "noreply@hakeemsa.com"
          protected='^(main|master)$'
          tagged=0; deleted=0; skipped=0; commented=0
          while IFS= read -r b; do
            b="${b%%[[:space:]]*}"; [ -z "$b" ] && continue
            if [[ "$b" =~ $protected ]]; then echo "SKIP protected $b"; skipped=$((skipped+1)); continue; fi
            sha=$(git ls-remote --heads origin "$b" | cut -f1)
            if [ -z "$sha" ]; then echo "SKIP missing $b"; skipped=$((skipped+1)); continue; fi
            echo "== $b $sha"
            if [ "$DRY" = "true" ]; then continue; fi
            if ! git ls-remote --tags origin "archive/$b" | grep -q .; then
              # عبر واجهة GitHub (لا يلزم جلب الكائن محليًّا؛ المستودع مُستخرج بعمق 1)
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/archive/$b" -f sha="$sha" >/dev/null; tagged=$((tagged+1))
            fi
            prs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$b" --jq '.[].number' || true)
            for pr in $prs; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$pr/comments" -f body="${NOTE//<branch>/$b}" >/dev/null && commented=$((commented+1))
            done
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b"; deleted=$((deleted+1))
          done < "$LIST"
          echo "tagged=$tagged deleted=$deleted commented=$commented skipped=$skipped" | tee -a "$GITHUB_STEP_SUMMARY"
