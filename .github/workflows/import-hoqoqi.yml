name: Import hoqoqi.sql into النواة (preamble-aware)

# يُفعّل «الجلب»: ينزّل hoqoqi.sql من رابط مشاركة OneDrive (مُدخَل، لا يُخزَّن)، ويشغّل المستورد
# المُصلَح (HKM-LAW-PREAMBLE-002) الذي يحفظ الديباجة (مادّة رقم صفر) وأداة الإصدار — على قاعدة
# النواة (Neon).
#
# الأمان (§22): الافتراض «فحص فقط» (dry-run) — يُظهر كم ديباجةً/مرسومًا سيُلتقَط دون كتابة.
# لا يكتب إلا حين apply=true صراحةً. المستورد idempotent (upsert للأنظمة، skipDuplicates للمواد).
# ⚠ قبل apply=true: خذ لقطة/فرع Neon كي يتوفّر rollback.

on:
  workflow_dispatch:
    inputs:
      share_url:
        description: "رابط مشاركة OneDrive لملف hoqoqi.sql"
        type: string
        required: true
      apply:
        description: "الكتابة إلى القاعدة؟ (false = فحص فقط/dry-run)"
        type: boolean
        default: false
      batch_size:
        description: "حجم دفعة الإدخال (اختياري)"
        type: string
        default: "250"

permissions:
  contents: read

concurrency:
  group: import-hoqoqi
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FALLBACK_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}" npm run db:generate
      - name: Download hoqoqi.sql from share link
        env:
          SHARE_URL: ${{ inputs.share_url }}
        run: |
          set -e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          is_ok() { local sz; sz=$(stat -c%s "$1" 2>/dev/null || echo 0); local h; h=$(head -c 200 "$1" | tr -d '\0')
            echo "   حجم=$sz"; case "$h" in *"<!DOCTYPE"*|*"<html"*|*"<HTML"*) return 1;; esac; [ "$sz" -gt 500000 ]; }
          dl() { echo ">> $1"; curl -sSL -c /tmp/cj -b /tmp/cj -A "$UA" --max-time 600 -o hoqoqi.sql \
                   -w "   HTTP %{http_code} · %{content_type} · %{size_download}B\n" "$2" || true; }
          case "$SHARE_URL" in *\?*) U1="$SHARE_URL&download=1";; *) U1="$SHARE_URL?download=1";; esac
          dl "download=1" "$U1"
          if ! is_ok hoqoqi.sql; then
            BASE=$(echo "$SHARE_URL" | sed -E 's#(/personal/[^/]+)/.*#\1#')
            TOKEN=$(echo "$SHARE_URL" | sed -E 's#.*/personal/[^/]+/([^/?]+).*#\1#')
            dl "download.aspx" "$BASE/_layouts/15/download.aspx?share=$TOKEN"
            is_ok hoqoqi.sql || { echo "::error::تعذّر تنزيل الملف (قد يتطلّب مصادقة/نطاق «أي شخص لديه الرابط»)."; exit 1; }
          fi
          echo "✔ جاهز"
      - name: Import (dry-run or apply)
        run: |
          export DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          if [ "${{ inputs.apply }}" = "true" ]; then
            if [ -z "$DATABASE_URL" ]; then echo "::error::apply=true يتطلّب DATABASE_URL (سرّ Neon) — غير مضبوط."; exit 1; fi
            echo "::warning::الكتابة مُفعّلة (apply). تأكّد من وجود لقطة/فرع Neon للتراجع."
            npx tsx scripts/import-hoqoqi-sql.ts --file=hoqoqi.sql --apply --batch-size=${{ inputs.batch_size }} --resume
          else
            echo "وضع الفحص فقط (dry-run): يُظهر preamblesDiscovered/instrumentsDiscovered دون كتابة."
            npx tsx scripts/import-hoqoqi-sql.ts --file=hoqoqi.sql
          fi
