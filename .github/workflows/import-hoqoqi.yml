name: Import hoqoqi.sql into النواة (preamble-aware)

# يُفعّل «الجلب»: ينزّل hoqoqi.sql(.zip) من Google Drive (أو OneDrive)، ويشغّل المستورد المُصلَح
# (HKM-LAW-PREAMBLE-002) الذي يحفظ الديباجة (مادّة رقم صفر) وأداة الإصدار — على قاعدة النواة (Neon).
#
# الأمان (§22): الافتراض «فحص فقط» (dry-run) — يُظهر كم ديباجةً/مرسومًا سيُلتقَط دون كتابة.
# لا يكتب إلا حين apply=true صراحةً. المستورد idempotent (upsert للأنظمة، skipDuplicates + resume للمواد).
# ⚠ قبل apply=true: خذ لقطة/فرع Neon كي يتوفّر rollback.

on:
  workflow_dispatch:
    inputs:
      gdrive:
        description: "رابط مشاركة Google Drive أو معرّف الملفّ (hoqoqi.sql.zip)"
        type: string
        default: ""
      share_url:
        description: "بديل: رابط مشاركة OneDrive لملف hoqoqi.sql (إن لم تستعمل Google Drive)"
        type: string
        default: ""
      apply:
        description: "الكتابة إلى القاعدة؟ (false = فحص فقط/dry-run)"
        type: boolean
        default: false
      batch_size:
        description: "حجم دفعة الإدخال (اختياري)"
        type: string
        default: "250"

permissions:
  contents: read

concurrency:
  group: import-hoqoqi
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FALLBACK_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}" npm run db:generate
      - name: Download hoqoqi source
        env:
          GDRIVE: ${{ inputs.gdrive }}
          SHARE_URL: ${{ inputs.share_url }}
        run: |
          set -e
          is_ok() { local sz; sz=$(stat -c%s "$1" 2>/dev/null || echo 0); local h; h=$(head -c 200 "$1" | tr -d '\0')
            echo "   حجم=$sz"; case "$h" in *"<!DOCTYPE"*|*"<html"*|*"<HTML"*) return 1;; esac; [ "$sz" -gt 500000 ]; }
          if [ -n "$GDRIVE" ]; then
            echo ">> Google Drive"
            OUT=hoqoqi.sql.zip
            # استخراج معرّف Drive (سلسلة طويلة) من الرابط أو استعماله كما هو.
            ID=$(printf '%s' "$GDRIVE" | grep -oE '[-_a-zA-Z0-9]{25,}' | head -1)
            [ -z "$ID" ] && ID="$GDRIVE"
            echo "   Drive id: $ID"
            is_zip() { head -c2 "$1" 2>/dev/null | grep -q "PK"; }
            # محاولة 1: نقطة usercontent مع confirm=t (تكفي للملفّات الصغيرة/المتوسطة العامّة).
            curl -sSL -c /tmp/gcj "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" -o "$OUT" \
              -w "   م1 HTTP %{http_code} · %{content_type} · %{size_download}B\n" || true
            if ! is_zip "$OUT"; then
              echo "   >> تحليل نموذج التأكيد"
              curl -sSL -c /tmp/gcj "https://drive.usercontent.google.com/download?id=$ID&export=download" -o page.html || true
              CONFIRM=$(sed -n 's/.*name="confirm"[^>]*value="\([^"]*\)".*/\1/p' page.html | head -1)
              UUID=$(sed -n 's/.*name="uuid"[^>]*value="\([^"]*\)".*/\1/p' page.html | head -1)
              curl -sSL -b /tmp/gcj "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=${CONFIRM}&uuid=${UUID}" -o "$OUT" \
                -w "   م2 HTTP %{http_code} · %{content_type} · %{size_download}B\n" || true
            fi
            if ! is_zip "$OUT"; then
              echo "   >> fallback: gdown أحدث"
              python3 -m pip install --quiet --upgrade "gdown>=5.1.0" || true
              python3 -m gdown --fuzzy "$GDRIVE" -O "$OUT" || python3 -m gdown "$ID" -O "$OUT" || true
            fi
            { is_ok "$OUT" && is_zip "$OUT"; } || { echo "::error::تعذّر تنزيل الملفّ من Google Drive — تأكّد أنّ المشاركة «أيّ شخص لديه الرابط»."; head -c 300 "$OUT" | tr -d '\0'; exit 1; }
            echo "HOQOQI_FILE=$OUT" >> "$GITHUB_ENV"
            echo "أوّل بايتات (PK = zip):"; head -c 4 "$OUT" | xxd | head -1 || true
          elif [ -n "$SHARE_URL" ]; then
            echo ">> OneDrive عبر curl"
            UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
            dl() { echo ">> $1"; curl -sSL -c /tmp/cj -b /tmp/cj -A "$UA" --max-time 600 -o hoqoqi.sql \
                     -w "   HTTP %{http_code} · %{content_type} · %{size_download}B\n" "$2" || true; }
            case "$SHARE_URL" in *\?*) U1="$SHARE_URL&download=1";; *) U1="$SHARE_URL?download=1";; esac
            dl "download=1" "$U1"
            if ! is_ok hoqoqi.sql; then
              BASE=$(echo "$SHARE_URL" | sed -E 's#(/personal/[^/]+)/.*#\1#')
              TOKEN=$(echo "$SHARE_URL" | sed -E 's#.*/personal/[^/]+/([^/?]+).*#\1#')
              dl "download.aspx" "$BASE/_layouts/15/download.aspx?share=$TOKEN"
              is_ok hoqoqi.sql || { echo "::error::تعذّر تنزيل الملفّ من OneDrive."; exit 1; }
            fi
            echo "HOQOQI_FILE=hoqoqi.sql" >> "$GITHUB_ENV"
          else
            echo "::error::مرّر gdrive (Google Drive) أو share_url (OneDrive)."; exit 1
          fi
          echo "✔ جاهز: $HOQOQI_FILE"
      - name: Import (dry-run or apply)
        run: |
          export DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          FILE="${HOQOQI_FILE:-hoqoqi.sql.zip}"
          if [ "${{ inputs.apply }}" = "true" ]; then
            if [ -z "$DATABASE_URL" ]; then echo "::error::apply=true يتطلّب DATABASE_URL (سرّ Neon) — غير مضبوط."; exit 1; fi
            echo "::warning::الكتابة مُفعّلة (apply). تأكّد من وجود لقطة/فرع Neon للتراجع."
            npx tsx scripts/import-hoqoqi-sql.ts --file="$FILE" --apply --batch-size=${{ inputs.batch_size }} --resume
          else
            echo "وضع الفحص فقط (dry-run): يُظهر preamblesDiscovered/instrumentsDiscovered دون كتابة."
            npx tsx scripts/import-hoqoqi-sql.ts --file="$FILE"
          fi
