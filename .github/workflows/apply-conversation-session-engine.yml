name: Apply Conversation Session Engine (Neon)

# يطبّق مهاجرة محرك الجلسات على Neon (توسيع chat_conversations / chat_messages + ربط generation_jobs).
# idempotent قدر الإمكان (IF NOT EXISTS / IF EXISTS). لا يحذف بيانات.
# مُقفل: APPLY + NEON_RUNTIME_CONFIRMED + حارس Neon. يستعمل سرّ NEON_DATABASE_URL فقط.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "اكتب APPLY لتأكيد التطبيق على Neon"
        type: string
        required: true
        default: ""
      CONFIRM_RUNTIME_DB_ALIGNMENT:
        description: "اكتب NEON_RUNTIME_CONFIRMED لتأكيد أن الهدف هو Neon"
        type: string
        required: true
        default: ""

concurrency:
  group: apply-conversation-session-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PGURL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: تحقق
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then echo "::error::اكتب APPLY للتأكيد."; exit 1; fi
          if [ "${{ inputs.CONFIRM_RUNTIME_DB_ALIGNMENT }}" != "NEON_RUNTIME_CONFIRMED" ]; then
            echo "::error::اكتب NEON_RUNTIME_CONFIRMED."; exit 1
          fi
          if [ -z "$PGURL" ]; then echo "::error::NEON_DATABASE_URL مفقود."; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run db:generate

      - name: "🛡️ حارس هدف Neon"
        run: npx tsx scripts/verify-neon-target.ts

      - name: تثبيت psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: "تطبيق مهاجرة محرك الجلسات"
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260725170000_conversation_session_engine/migration.sql

      - name: "تحقّق بعد الكتابة (قراءة فقط)"
        run: |
          psql "$PGURL" -c "SELECT column_name FROM information_schema.columns WHERE table_name='chat_conversations' AND column_name IN ('service_key','generated_title','status','preview') ORDER BY 1;"
          psql "$PGURL" -c "SELECT column_name FROM information_schema.columns WHERE table_name='chat_messages' AND column_name IN ('sequence','status','client_request_id','job_id') ORDER BY 1;"
          psql "$PGURL" -c "SELECT indexname FROM pg_indexes WHERE tablename IN ('chat_conversations','chat_messages','generation_jobs') AND indexname LIKE '%service%' OR indexname LIKE '%client_request%' OR indexname LIKE 'chat_conversations_%' ORDER BY 1 LIMIT 30;"
