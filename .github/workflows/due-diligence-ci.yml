name: Due Diligence CI

on:
  pull_request:
    paths:
      - "lib/modules/due-diligence/**"
      - "app/api/due-diligence/**"
      - "scripts/test-due-diligence.ts"
      - "scripts/probe-mc-gis.ts"
      - ".github/workflows/due-diligence-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare verified DigiCert intermediate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://cacerts.digicert.com/DigiCertGlobalG2TLSRSASHA2562020CA1-1.crt.pem \
            --output /tmp/digicert-intermediate.pem
          ACTUAL="$(openssl x509 -in /tmp/digicert-intermediate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          EXPECTED="C8025F9FC65FDFC95B3CA8CC7867B9A587B5277973957917463FC813D0B625A9"
          test "$ACTUAL" = "$EXPECTED"
          openssl x509 -in /tmp/digicert-intermediate.pem -noout -subject -issuer -dates

      - name: Inspect current Ministry GIS frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://mc.gov.sa/ar/About/Statistics/Pages/GISInfo.aspx \
            --output /tmp/gis.html
          echo '--- GIS/API references in page ---'
          grep -Ein '_api|GIS|ajax|api/|Commercial-data|\.js' /tmp/gis.html | head -n 120 || true
          echo '--- Script sources ---'
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/gis.html | sed -E 's/.*src="([^"]+)"/\1/' | head -n 100 || true

      - name: Ministry of Commerce legacy GIS API probe
        continue-on-error: true
        env:
          NODE_EXTRA_CA_CERTS: /tmp/digicert-intermediate.pem
        run: npx tsx scripts/probe-mc-gis.ts

      - name: Due diligence acceptance test
        run: npx tsx scripts/test-due-diligence.ts

      - name: Typecheck
        run: npm run typecheck
