name: Due Diligence CI

on:
  pull_request:
    paths:
      - "lib/modules/due-diligence/**"
      - "app/api/due-diligence/**"
      - "scripts/test-due-diligence.ts"
      - "scripts/probe-mc-gis.ts"
      - ".github/workflows/due-diligence-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ministry of Commerce production connector probe
        run: npx tsx scripts/probe-mc-gis.ts

      - name: Due diligence acceptance test
        run: npx tsx scripts/test-due-diligence.ts

      - name: Typecheck
        run: npm run typecheck
