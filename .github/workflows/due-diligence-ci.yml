name: Due Diligence CI

on:
  pull_request:
    paths:
      - "lib/modules/due-diligence/**"
      - "app/api/due-diligence/**"
      - "scripts/test-due-diligence.ts"
      - "scripts/probe-mc-gis.ts"
      - ".github/workflows/due-diligence-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Ministry of Commerce TLS certificate
        shell: bash
        run: |
          set -o pipefail
          echo | openssl s_client -connect mc.gov.sa:443 -servername mc.gov.sa -showcerts 2>/dev/null \
            | openssl x509 -noout -subject -issuer -serial -dates -ext authorityInfoAccess

      - name: Ministry of Commerce GIS live connectivity probe
        continue-on-error: true
        env:
          NODE_OPTIONS: --use-system-ca
        run: npx tsx scripts/probe-mc-gis.ts

      - name: Due diligence acceptance test
        run: npx tsx scripts/test-due-diligence.ts

      - name: Typecheck
        run: npm run typecheck
