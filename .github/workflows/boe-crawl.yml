name: BOE crawl (زحف هيئة الخبراء من شبكة GitHub Actions)

# HKM-036: بيئة الوكيل محجوبة عن laws.boe.gov.sa، وشبكة GitHub Actions غير محجوبة (نمط render-source/nezams).
# خام فقط (أمر الزحف 2.2): صفحات الأنظمة R0 ومرفقات العارض R1 كما تُقدَّم (صور الصفحات أو PDF). لا OCR ولا استخراج هنا.
# النتائج: artifact + فرع crawl/boe-<run> (لا يلمس main). يدوي فقط، بوتيرة مهذبة.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "ملف الأهداف JSONL"
        type: string
        required: true
        default: ingest/crawl-2026-10-23/targets/r0-empty-pages.jsonl
      kind:
        description: "law | attachment | all"
        type: choice
        required: true
        default: all
        options: [all, law, attachment]
      limit:
        description: "حد أقصى للأهداف (0 = الكل)"
        type: string
        required: true
        default: "20"
      offset:
        description: "تخطّي أول N هدف من الملف (دفعات متتابعة)"
        type: string
        required: true
        default: "0"
      pace_ms:
        description: "الوتيرة بين الطلبات بالملّي ثانية"
        type: string
        required: true
        default: "1500"
      max_pages:
        description: "أقصى عدد صور لكل مرفق"
        type: string
        required: true
        default: "400"
      deadline_min:
        description: "توقف هادئ بعد هذه الدقائق مع حفظ ما جُلب (أقل من سقف الوظيفة 300)"
        type: string
        required: true
        default: "270"

permissions:
  contents: write

concurrency:
  group: boe-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: إكمال سلسلة الشهادات (الخادم لا يرسل الوسيطة؛ تُجلب من AIA ولا يُعطَّل التحقق)
        run: |
          set -euo pipefail
          host=laws.boe.gov.sa
          openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null | openssl x509 -outform PEM > leaf.pem
          openssl x509 -in leaf.pem -noout -subject -issuer | tee -a "$GITHUB_STEP_SUMMARY"
          aia=$(openssl x509 -in leaf.pem -noout -text | grep -A1 "Authority Information Access" -A3 | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | sed 's/CA Issuers - URI://')
          echo "AIA: $aia" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$aia" ] || { echo "::error::لا رابط AIA في شهادة الخادم"; exit 1; }
          curl -sS --max-time 40 -o inter.bin "$aia"
          (openssl x509 -inform DER -in inter.bin -out inter.pem 2>/dev/null || openssl x509 -inform PEM -in inter.bin -out inter.pem)
          openssl x509 -in inter.pem -noout -subject -issuer | tee -a "$GITHUB_STEP_SUMMARY"
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > "$RUNNER_TEMP/bundle.pem"
          # التحقق الكامل بالسلسلة المكتملة ضد مخزن الجذور الموثوقة في النظام
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted inter.pem leaf.pem | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/bundle.pem" >> "$GITHUB_ENV"
          echo "CURL_CA_BUNDLE=$RUNNER_TEMP/bundle.pem" >> "$GITHUB_ENV"
      - name: فحص الوصول
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 40 "https://laws.boe.gov.sa/BoeLaws/Laws/LawDetails/53cfe087-dae1-4b95-8dff-a9a700f29f3b/1" || echo 000)
          echo "laws.boe.gov.sa -> HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || { echo "::error::الهيئة غير متاحة من هذا المشغّل (HTTP $code)"; exit 1; }
      - name: الزحف
        run: |
          out="ingest/crawl-2026-10-23/runs/${GITHUB_RUN_ID}"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          python3 ingest/crawl-2026-10-23/scripts/boe_fetch.py --targets "${{ inputs.targets }}" --out "$out" --kind "${{ inputs.kind }}" --limit "${{ inputs.limit }}" --offset "${{ inputs.offset }}" --pace-ms "${{ inputs.pace_ms }}" --max-pages "${{ inputs.max_pages }}" --deadline-min "${{ inputs.deadline_min }}" | tee "$out/log.txt"
          tail -1 "$out/log.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && env.OUT != ''
        with:
          name: boe-crawl-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 30
      - name: حفظ الخام في فرع crawl/boe-<run>
        if: always() && env.OUT != ''
        run: |
          git config user.name "hakeem-crawl-bot"
          git config user.email "noreply@hakeemsa.com"
          b="crawl/boe-${GITHUB_RUN_ID}"
          git checkout -b "$b"
          git add "$OUT"
          git commit -q -m "HKM-036: زحف هيئة الخبراء الخام (run ${GITHUB_RUN_ID}) — $(tail -1 "$OUT/log.txt" 2>/dev/null || echo 'توقف قبل الختام')" || { echo "لا شيء للحفظ"; exit 0; }
          git push -q origin "$b"
          echo "branch=$b" >> "$GITHUB_STEP_SUMMARY"
