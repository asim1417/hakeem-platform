name: RASD Source Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Probe RASD live sources
        run: npx tsx scripts/rasd/probe-sources-live.ts --limit 10
      - name: Upload source health report
        uses: actions/upload-artifact@v4
        with:
          name: rasd-live-source-probe
          path: docs/rasd/reports/live-source-probe.json
