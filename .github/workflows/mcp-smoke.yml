name: MCP Smoke (temporary)

# مؤقّت: يختبر نقطة نهاية MCP الحيّة عبر مفتاح يُمرَّر كـ input. يُحذف بعد التشخيص.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "HAKEEM_MCP_KEY value to test against the live endpoint"
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ inputs.key }}
      BASE: https://hakeem-platform.vercel.app/mcp
    steps:
      - name: Mask key in logs
        run: echo "::add-mask::$KEY"

      - name: URL-encode key
        run: |
          ENC=$(jq -rn --arg k "$KEY" '$k|@uri')
          echo "::add-mask::$ENC"
          echo "ENC=$ENC" >> "$GITHUB_ENV"
          echo "key length: ${#KEY}"

      - name: (a) GET /mcp?key=***
        run: |
          echo "=== GET $BASE?key=*** ==="
          curl -i -sS --max-time 30 "$BASE?key=$ENC" || true

      - name: (b) POST initialize
        run: |
          echo "=== POST initialize ==="
          curl -i -sS --max-time 30 -D init_headers.txt -o init_body.txt \
            -X POST "$BASE?key=$ENC" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-06-18' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gh-smoke","version":"0"}}}' || true
          echo "--- init response headers ---"; cat init_headers.txt || true
          echo "--- init response body ---"; cat init_body.txt || true

      - name: (c) POST tools/list
        run: |
          SID=$(grep -i '^mcp-session-id:' init_headers.txt | tail -1 | tr -d '\r' | awk '{print $2}')
          echo "session id: ${SID:-<none>}"
          echo "=== POST tools/list ==="
          curl -i -sS --max-time 30 \
            -X POST "$BASE?key=$ENC" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-06-18' \
            ${SID:+-H "mcp-session-id: $SID"} \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' || true
