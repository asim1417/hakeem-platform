name: Rulings Research — Phase 1 Meta (dry-run, read-only)

# المرحلة الأولى (تشغيل جافّ): يشتق ruling_meta لكل الأحكام في الذاكرة ويقيس بوابة القبول، بلا كتابة.
# يشغّل scripts/rulings-research/01-meta.ts على Neon عبر اتصال مباشر (غير pooler)
# مع default_transaction_read_only=on، والسكربت يرفض العمل ما لم يثبت أن الجلسة للقراءة فقط.
# المستودع عام: المخرج أعداد فقط، ويُودَع في الفرع reports/rulings-research/01-meta.data.json.
# الكتابة الفعلية (--apply) على فرع Neon البحثي فقط، ولا تُشغَّل من هنا.

on:
  workflow_dispatch:
  push:
    branches: [aman/rulings-research-layer]
    paths:
      - .github/workflows/rulings-research-meta.yml
      - scripts/rulings-research/01-meta.ts
      - lib/rulings/research/meta.ts

concurrency:
  group: rulings-research-meta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FALLBACK_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}" npm run db:generate
      - name: "🛡️ اتصال مباشر للقراءة فقط (Neon)"
        run: |
          url="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          [ -z "$url" ] && { echo "::error::لا اتصال قاعدة."; exit 1; }
          host=$(printf '%s' "$url" | sed -E 's#.*@([^/:?]+).*#\1#')
          echo "$host" | grep -qiE 'neon|ep-' || { echo "::error::ليس مضيف Neon."; exit 1; }
          # الاتصال المباشر يقبل options (المجمّع لا يقبلها)؛ ونحذف معاملات المجمّع.
          direct=$(printf '%s' "$url" | sed -E 's#-pooler\.#.#; s#([?&])(pgbouncer|channel_binding|connection_limit)=[^&]*&?#\1#g; s#[?&]$##')
          echo "::add-mask::$direct"
          echo "AUDIT_DB_URL=$direct" >> "$GITHUB_ENV"
          echo "المضيف (مباشر): $(printf '%s' "$host" | sed -E 's#-pooler##')"
      - name: "المرحلة الأولى — تشغيل جافّ (قراءة فقط)"
        run: |
          DATABASE_URL="$AUDIT_DB_URL" AUDIT_TRANSPORT=prisma npx tsx scripts/rulings-research/01-meta.ts
      - name: "إيداع النتائج المجمّعة في الفرع"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/rulings-research/01-meta.data.json
          git diff --cached --quiet && { echo "لا تغيير"; exit 0; }
          git commit -m "data(rulings-research): phase 1 meta dry-run gate (aggregate, read-only run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
