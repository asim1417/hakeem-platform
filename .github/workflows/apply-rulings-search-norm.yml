name: Apply Rulings Search Index (Neon) — فهرسة بحث الأحكام

# يطبّق هجرة judicial_cases.search_norm + فهارسها ثمّ يملأ العمود على Neon.
# آمنٌ غير كاسر: العمود يُقرأ بـ SQL خام مع سقوطٍ للـ ILIKE، فالكود يعمل قبل التطبيق وبعده.
# الهجرة إضافيّة idempotent. مقفول: APPLY + NEON_RUNTIME_CONFIRMED + حارس مضيف Neon.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "اكتب APPLY لتأكيد التطبيق على Neon"
        type: string
        required: true
        default: ""
      CONFIRM_RUNTIME_DB_ALIGNMENT:
        description: "اكتب NEON_RUNTIME_CONFIRMED"
        type: string
        required: true
        default: ""
      rebuild_all:
        description: "إعادة بناء الكلّ (all) أو الناقص فقط (missing)"
        type: choice
        options: ["missing", "all"]
        default: "missing"

concurrency:
  group: apply-rulings-search-norm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FALLBACK_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: "تحقّق"
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then echo "::error::اكتب APPLY."; exit 1; fi
          if [ "${{ inputs.CONFIRM_RUNTIME_DB_ALIGNMENT }}" != "NEON_RUNTIME_CONFIRMED" ]; then echo "::error::اكتب NEON_RUNTIME_CONFIRMED."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}" npm run db:generate
      - name: "🛡️ حارس مضيف Neon"
        run: |
          url="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          [ -z "$url" ] && { echo "::error::لا اتصال قاعدة."; exit 1; }
          host=$(printf '%s' "$url" | sed -E 's#.*@([^/:?]+).*#\1#'); echo "المضيف: $host"
          echo "$host" | grep -qiE 'neon|ep-' || { echo "::error::ليس مضيف Neon."; exit 1; }
      - name: "تثبيت psql"
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: "① تطبيق الهجرة (idempotent)"
        run: |
          export DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --no-psqlrc -f prisma/migrations/20260911120000_judicial_cases_search_norm/migration.sql
      - name: "② تعبئة search_norm"
        run: |
          export DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          EXTRA=""; [ "${{ inputs.rebuild_all }}" = "all" ] && EXTRA="--all"
          CONFIRM_RUNTIME_DB_ALIGNMENT=NEON_RUNTIME_CONFIRMED npx tsx scripts/backfill-rulings-search-norm.ts $EXTRA
      - name: "③ تحقّق"
        run: |
          export DATABASE_URL="${NEON_DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --no-psqlrc -A -F' | ' -P footer=off -c \
            "SELECT 'rulings_total' AS k, count(*) FROM judicial_cases
             UNION ALL SELECT 'with_search_norm', count(*) FROM judicial_cases WHERE search_norm IS NOT NULL AND length(search_norm) > 0;"
